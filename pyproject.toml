[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "light-inspired-neural-operator"
version = "0.1.0"
description = "Let There Be Light: Reflection, Refraction and Scattering for Neural Operators"
authors = [
    { name = "Keke Wu" },
    { name = "Yixuan Zhang" },
    { name = "Jingrun Chen" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "matplotlib>=3.7.0",
    "termcolor>=2.3.0",
    "Pillow>=9.5.0",
    "gdown>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",   # for datatest.ipynb
]

[tool.setuptools.packages.find]
where = ["src"]
